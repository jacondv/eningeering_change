services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
    networks:
      - default
      # Shares a network with ONLYOFFICE, which has no other one.
      - office_net

  # ONLYOFFICE Document Server: the in-browser Word/Excel/PowerPoint editor and the
  # PDF converter used by jacon_office. Odoo stays the only place files are stored;
  # this container only edits/converts the copy it is handed. Needs ~2-4 GB RAM.
  #
  # It is cut off from the internet: it is only on `office_net`, an `internal` network, and
  # publishes no port itself. Browsers reach it through `office_gateway` below.
  onlyoffice:
    image: onlyoffice/documentserver:10.0.0
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      # Must equal "Document Server JWT Secret" in Odoo (Settings > ONLYOFFICE). Set it in .env.
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      # Odoo is reached over the private Docker network; Document Server blocks private IPs by default.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-lib:/var/lib/onlyoffice
      - onlyoffice-log:/var/log/onlyoffice
    networks:
      - office_net

  # The only way in to ONLYOFFICE: publishes its port on the host and passes the traffic on
  # (WebSocket included) over `office_net`.
  office_gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - onlyoffice
    ports:
      - "8082:80"
    volumes:
      - ./config/onlyoffice-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - office_net

volumes:
  odoo-db-data:
  odoo-web-data:
  onlyoffice-data:
  onlyoffice-lib:
  onlyoffice-log:

networks:
  # No route to the outside world: what is only on this network cannot reach the internet.
  office_net:
    internal: true
